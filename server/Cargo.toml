[package]
name = "playsomthng-server"
version = "0.1.0"
edition = "2024"
description = "PlaySomthng API server (dev: static JSON, no auth)"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
url = "2"
urlencoding = "2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
ed25519-dalek = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
